name: Sayfayı GitHub Pages'e yayınla

# Matgebra bir Vue uygulamasidir; deponun kokunu oldugu gibi yayinlamak
# calisan bir sayfa vermez. Bu is akisi once veritabanini veri/ klasorundeki
# MEB kaynagindan kurar, API yanitlarini statik JSON'a doker, ardindan
# arayuzu derleyip yalnizca ciktiyi (apps/web/dist) yayinlar.

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Ayni anda tek yayin; suren yayin iptal edilmez.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  derle-ve-yayinla:
    environment:
      name: github-pages
      url: ${{ steps.yayin.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Bagimliliklar
        run: npm ci

      - name: Veritabanini kur
        # veri/icerik.db ve veri/unite/*.json -> db/matgebra.db
        run: npm run db:kur

      - name: Statik surumu derle
        # API yanitlarini JSON'a doker, sonra arayuzu derler
        run: npm run statik

      - name: Pages yapilandirmasi
        uses: actions/configure-pages@v5

      - name: Ciktiyi yukle
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

      - name: Yayinla
        id: yayin
        uses: actions/deploy-pages@v4
